title: Windows Defender Intermediary Artifact Was Observed
id: 4b247b96-4b24-4b24-ab24-4b247b960000
status: stable
description: Detection rule for MITRE ATT&CK technique T1068
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_defender_intermediary_artifact_was_observed.yml
author: splunk (via IncidentBuddy)
date: 2026-10-04
tags:
  - attack.t1068
logsource:
  product: defender
  service: xdr
detection:
  selection:
    # Original splunk detection logic
    # -
    #     `sysmon`
    #     EventID IN (11, 15, 23)
    #     process_name IN (
    #         "System",
    #         "msmpeng.exe"
    #     )
    #     user=SYSTEM
    #     NOT TargetFilename IN (
    #         "C:\\Windows\\Temp\\*",
    #         "*:Zone.Identifier",
    #         "*:SmartScreen"
    #     )
    # 
    #     | regex TargetFilename!="(?i)\.\w{1,10}$"
    # 
    #     | stats count values(EventID) as EventID
    #                   values(TargetFilename) as TargetFilename
    #                   dc(EventID) as dc_EventID
    #                   dc(TargetFilename) as dc_TargetFilename
    #                   min(_time) as firstTime
    #                   max(_time) as lastTime
    # 
    #       by dest process_id process_name user
    # 
    #     | search dc_TargetFilename>1 dc_EventID>1
    # 
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `windows_defender_intermediary_artifact_was_observed_filter`
  condition: selection
level: medium
