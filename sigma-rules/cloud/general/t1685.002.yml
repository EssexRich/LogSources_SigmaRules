title: GitHub Enterprise Disable Audit Log Event Stream
id: 2226a13e-2226-4226-a226-2226a13e0000
status: stable
description: Detection rule for MITRE ATT&CK technique T1685.002
references:
  - https://github.com/splunk/security_content/blob/develop/detections/cloud/github_enterprise_disable_audit_log_event_stream.yml
author: splunk (via IncidentBuddy)
date: 2026-07-05
tags:
  - attack.t1685.002
logsource:
  product: cloud
  service: general
detection:
  selection:
    # Original splunk detection logic
    # -
    #     `github_enterprise` action=audit_log_streaming.destroy
    #       | fillnull
    #       | stats count min(_time) as firstTime max(_time) as lastTime
    #         BY actor, actor_id, actor_ip,
    #            actor_is_bot, actor_location.country_code, business,
    #            business_id, user_agent, action
    #       | eval user=actor
    #       | `security_content_ctime(firstTime)`
    #       | `security_content_ctime(lastTime)`
    #       | `github_enterprise_disable_audit_log_event_stream_filter`
  condition: selection
level: medium
