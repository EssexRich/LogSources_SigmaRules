    # FROM logs-macos.process_execution_monitoring-* metadata _id, _version, _index
    # | WHERE data_stream.dataset == "macos.process_execution_monitoring" and
    #     macos.event.message.description LIKE "*effectiveItemDisposition*" and
    #     (macos.event.message.description LIKE "*url=file://*/Library/LaunchAgents/.*" or
    #         macos.event.message.description LIKE "*url=file://*/Library/LaunchDaemons/.*")
    # | GROK macos.event.message.description "url=file://%{DATA:Esql.plist_path}, config"
    # | GROK macos.event.message.description "type=%{DATA:Esql.item_type},"
    # | GROK macos.event.message.description "BTMConfigExecutablePath = \"%{DATA:Esql.executable}\""
    # | WHERE Esql.plist_path RLIKE ".*/Library/Launch(Agents|Daemons)/\\..*\\.plist"
    # | KEEP _id, _version, _index, @timestamp, host.name, Esql.plist_path, Esql.item_type, Esql.executable, macos.event.message.description
  condition: selection
