title: MacOS Log Removal
id: 6bc46ce6-6bc4-4bc4-abc4-6bc46ce60000
status: stable
description: Detection rule for MITRE ATT&CK technique T1070
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/macos_log_removal.yml
author: splunk (via IncidentBuddy)
date: 2026-05-31
tags:
  - attack.t1070
logsource:
  product: macos
  service: general
detection:
  selection:
    # Original splunk detection logic
    # -
    #     | tstats `security_content_summariesonly`
    #       count min(_time) as firstTime
    #             max(_time) as lastTime
    # 
    #     from datamodel=Endpoint.Processes where
    # 
    #     Processes.process = "*system.log*"
    #     AND
    #     (
    #         (Processes.process = "*rm *")
    #         OR
    #         (
    #             Processes.process = "*audit*"
    #             Processes.process = "* -s *"
    #         )
    #     )
    # 
    #     by Processes.dest Processes.original_file_name Processes.parent_process_id
    #        Processes.process Processes.process_exec Processes.process_guid
    #        Processes.process_hash Processes.process_id
    #        Processes.process_current_directory Processes.process_name
    #        Processes.process_path Processes.user
    #        Processes.user_id Processes.vendor_product
    # 
    #     | `drop_dm_object_name(Processes)`
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `macos_log_removal_filter`
  condition: selection
level: medium
