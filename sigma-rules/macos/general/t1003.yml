title: Dumping Account Hashes via Built-In Commands
id: 437f05a4-437f-437f-a37f-437f05a40000
status: stable
description: Detection rule for MITRE ATT&CK technique T1003
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/macos/credential_access_dumping_hashes_bi_cmds.toml
author: elastic (via IncidentBuddy)
date: 2026-08-30
tags:
  - attack.t1003
logsource:
  product: macos
  service: general
detection:
  selection:
    # Original elastic detection logic
    # process where host.os.type == "macos" and event.type in ("start","process_started") and (
    #   (process.name == "defaults" and process.args like~ "ShadowHashData") or
    #   (process.name == "mkpassdb" and process.args == "-dump") or
    #   (process.name == "dscl" and process.args like~ "ShadowHashData") or
    #   (
    #     process.name in ("plutil","cat","strings","xxd","head") and
    #     process.args like "/var/db/dslocal/nodes/Default/users/*.plist"
    #   )
    # )
  condition: selection
level: medium
