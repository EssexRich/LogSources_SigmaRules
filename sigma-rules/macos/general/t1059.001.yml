title: Suspicious Browser Child Process
id: 111d88cb-111d-411d-a11d-111d88cb0000
status: stable
description: Detection rule for MITRE ATT&CK technique T1059.001
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/macos/execution_initial_access_suspicious_browser_childproc.toml
author: elastic (via IncidentBuddy)
date: 2026-07-05
tags:
  - attack.t1059.001
logsource:
  product: macos
  service: general
detection:
  selection:
    # Original elastic detection logic
    # process where host.os.type == "macos" and event.type in ("start", "process_started") and
    #   process.parent.name like~ ("Google Chrome", "Google Chrome Helper*", "firefox", "Opera", "Safari", "com.apple.WebKit.WebContent", "Microsoft Edge") and
    #   ((process.name like~ ("sh", "bash", "dash", "ksh", "tcsh", "zsh") and process.command_line : ("*curl*", "*nscurl*", "*wget*", "*whoami*", "*pwd*")) or
    #   process.name like~ ("curl", "wget", "python*", "perl*", "php*", "osascript", "pwsh")) and
    #   process.command_line != null
  condition: selection
level: medium
