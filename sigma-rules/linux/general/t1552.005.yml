title: Suspicious Instance Metadata Service (IMDS) API Command Line Execution
id: 39ff57f4-39ff-49ff-a9ff-39ff57f40000
status: stable
description: Detection rule for MITRE ATT&CK technique T1552.005
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/credential_access_suspicious_instance_metadata_service_api_cli.toml
author: elastic (via IncidentBuddy)
date: 2026-07-05
tags:
  - attack.t1552.005
logsource:
  product: linux
  service: general
detection:
  selection:
    # Original elastic detection logic
    # process where host.os.type in ("linux", "macos", "windows") and event.type == "start" and
    # event.action like ("exec", "exec_event", "start", "ProcessRollup2", "executed", "process_started", "Process Create*") and
    # (
    #   process.name in~ (
    #     "curl", "curl.exe", "wget", "wget.exe", "bash", "dash", "sh", "tcsh", "tclsh", "wish",
    #     "csh", "zsh", "ksh", "fish", "mksh", "busybox", "powershell.exe", "cmd.exe", "pwsh.exe", "pwsh"
    #   ) or
    #   process.name like~ (".*", "python*", "perl*", "ruby*", "php*", "lua*", "java*") or
    #   ?process.executable like~ (
    #     "/tmp/*", "/var/tmp/*", "/dev/shm/*", "/home/*/*", "/var/run/*", "/run/*", "/boot/*", "/.*", "C:\\Users\\*",
    #     "?:\\ProgramData\\*", "/var/www/*", "./*"
    #   )
    # ) and
    # process.args like~ (
    #   "*/latest/meta-data/iam/security-credentials/?*",
    #   "*computeMetadata/v1/instance/service-accounts/*/oauth2/access_token*",
    #   "*/metadata/identity/oauth2/token*resource=*"
    # )
  condition: selection
level: medium
