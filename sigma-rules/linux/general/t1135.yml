title: Manual Mount Discovery via /etc/exports or /etc/fstab
id: 4256d628-4256-4256-a256-4256d6280000
status: stable
description: Detection rule for MITRE ATT&CK technique T1135
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/linux/discovery_manual_mount_discovery_via_exports_or_fstab.toml
author: elastic (via IncidentBuddy)
date: 2026-07-26
tags:
  - attack.t1135
logsource:
  product: linux
  service: general
detection:
  selection:
    # Original elastic detection logic
    # process where host.os.type == "linux" and event.type == "start" and
    # event.action in ("exec", "exec_event", "start", "ProcessRollup2", "executed", "process_started") and
    # process.name in ("cat", "grep", "tail", "less", "more", "egrep", "fgrep", "awk") and
    # process.command_line like ("/etc/exports", "/etc/fstab")
  condition: selection
level: medium
