title: Encoded Payload Detected via Defend for Containers
id: 2b302baf-2b30-4b30-ab30-2b302baf0000
status: stable
description: Detection rule for MITRE ATT&CK technique T1204.002
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/integrations/cloud_defend/defense_evasion_potential_evasion_via_encoded_payload.toml
