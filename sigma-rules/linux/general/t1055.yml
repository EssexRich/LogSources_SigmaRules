title: Linux Process Hooking via GDB
id: 63364993-6336-4336-a336-633649930000
status: stable
description: Detection rule for MITRE ATT&CK technique T1055
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/linux/credential_access_gdb_process_hooking.toml
author: elastic (via IncidentBuddy)
date: 2026-06-21
tags:
  - attack.t1055
logsource:
  product: linux
  service: general
detection:
  selection:
    # Original elastic detection logic
    # process where host.os.type == "linux" and event.type == "start" and event.action in ("exec", "exec_event", "start", "ProcessRollup2", "executed", "process_started")
    #  and process.name == "gdb" and process.args in ("--pid", "-p") and
    # /* Covered by d4ff2f53-c802-4d2e-9fb9-9ecc08356c3f */
    # process.args != "1"
  condition: selection
level: medium
