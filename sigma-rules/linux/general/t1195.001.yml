    #     false
    #   )
    # 
    # | EVAL cmdline_lower = TO_LOWER(process.command_line)
    # | EVAL parent_cmdline_lower = TO_LOWER(process.parent.command_line)
    # 
    # | EVAL is_curl_download = CASE(
    #     process.name == "curl" AND
    #     cmdline_lower LIKE "*http*" AND
    #     process.args_count <= 5 AND
    #     (
    #       cmdline_lower LIKE "* -o*" OR 
    # 	  cmdline_lower LIKE "* --output*" OR 
    #       parent_cmdline_lower LIKE "*zsh" OR
    #       parent_cmdline_lower LIKE "*sh" OR
    #       parent_cmdline_lower LIKE "*bash" OR
    #       parent_cmdline_lower LIKE "*dash"
    #     ) AND
    #     NOT (
    #       cmdline_lower LIKE "*169.254.169.254*" OR
    #       cmdline_lower LIKE "*localhost*" OR
    #       cmdline_lower LIKE "*127.0.0.1*"
    #     ),
    #     true, false
    #   )
    # 
    # | WHERE process.Ext.ancestry IS NOT NULL AND (is_curl_download OR is_pkg_install)
    # 
    # // Capture entity_ids for package install parent processes
    # | EVAL all_entity_id = CASE(is_pkg_install, process.parent.entity_id, "null")
    # 
    # // Collect all package install entity_ids globally
    # | INLINE STATS all_pkg_entity_ids = VALUES(all_entity_id), all_pkg_cmdline = VALUES(process.parent.command_line) WHERE all_entity_id != "null" by host.id
    # 
    # // Find which package install entity_ids appear in this process's ancestry
    # | EVAL Esql.pkg_ancestor_ids = MV_INTERSECTION(all_pkg_entity_ids, process.Ext.ancestry)
    # 
    # // curl download descended from an npm package install process
    # | WHERE Esql.pkg_ancestor_ids IS NOT NULL AND is_curl_download
    # 
    # | KEEP _id, _version, _index, data_stream.namespace, host.id, host.name, user.name, process.entity_id, process.executab
    # ... [truncated]
  condition: selection
