title: Windows Azure PowerShell Module Installation Via PowerShell Script
id: 19a5734d-19a5-49a5-a9a5-19a5734d0000
status: stable
description: Detection rule for MITRE ATT&CK technique T1069.003
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_azure_powershell_module_installation_via_powershell_script.yml
author: splunk (via IncidentBuddy)
date: 2026-05-17
tags:
  - attack.t1069.003
logsource:
  product: azure
  service: activity_logs
detection:
  selection:
    # Original splunk detection logic
    # -
    #     `powershell`
    #     EventID="4104"
    #     ScriptBlockText IN (
    #         "*Install-Module -Name AADInternals*",
    #         "*Install-Module -Name Az.Resources*",
    #         "*Install-Module -Name AzureAd*",
    #         "*Install-Module -Name MSOnline*",
    #         "*Install-Module AADInternals*",
    #         "*Install-Module Az.Resources*",
    #         "*Install-Module AzureAd*",
    #         "*Install-Module MSOnline*"
    #     )
    #     | fillnull
    #     | stats count min(_time) as firstTime
    #             max(_time) as lastTime
    #       by Computer EventID ScriptBlockText signature signature_id
    #          user_id vendor_product Guid Opcode
    #          Name Path ProcessID ScriptBlockId
    # 
    #     | rename Computer as dest
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `windows_azure_powershell_module_installation_via_powershell_script_filter`
  condition: selection
level: medium
