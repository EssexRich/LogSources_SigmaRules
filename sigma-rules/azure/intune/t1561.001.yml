status: stable
description: Detection rule for MITRE ATT&CK technique T1561.001
references:
  - https://github.com/splunk/security_content/blob/develop/detections/cloud/microsoft_intune_bulk_wipe.yml
author: splunk (via IncidentBuddy)
date: 2026-08-16
tags:
  - attack.t1561.001
logsource:
  product: azure
