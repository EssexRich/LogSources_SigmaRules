description: Detection rule for MITRE ATT&CK technique T1685
references:
  - https://github.com/splunk/security_content/blob/develop/detections/cloud/microsoft_intune_devicemanagementconfigurationpolicies.yml
author: splunk (via IncidentBuddy)
