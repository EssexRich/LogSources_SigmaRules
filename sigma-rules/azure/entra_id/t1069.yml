status: stable
description: Detection rule for MITRE ATT&CK technique T1069
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/integrations/azure/credential_access_device_code_signin_aad_graph_enum.toml
author: elastic (via IncidentBuddy)
date: 2026-07-12
tags:
  - attack.t1069
logsource:
  product: azure
  service: entra_id
detection:
  selection:
    # Original elastic detection logic
    # sequence by user.id, azure.tenant_id with maxspan=5m
    # [authentication where
    #     data_stream.dataset == "azure.signinlogs" and
    #     event.outcome == "success" and
    #     azure.signinlogs.properties.authentication_protocol == "deviceCode" and
    #     azure.signinlogs.properties.device_detail.is_managed == false and
    #     azure.signinlogs.properties.resource_id == "00000002-0000-0000-c000-000000000000"]
    # [web where
    #     data_stream.dataset == "azure.aadgraphactivitylogs" and
    #     url.path : (
    #         "*/users*",
    #         "*/groups*",
    #         "*/servicePrincipals*",
    #         "*/applications*",
    #         "*/applicationRefs*",
    #         "*/devices*",
    #         "*/directoryRoles*",
    #         "*/roleAssignments*",
    #         "*/eligibleRoleAssignments*",
    #         "*/roleDefinitions*",
    #         "*/directoryObjects*",
    #         "*/policies*",
    #         "*/oauth2PermissionGrants*",
    #         "*/administrativeUnits*",
    #         "*/tenantDetails*",
    #         "*/directorySettingTemplates*",
    #         "*/me*"
    #     )]
  condition: selection
level: medium
