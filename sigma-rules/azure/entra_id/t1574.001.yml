title: Untrusted DLL Loaded by Azure AD Connect Authentication Agent
id: 4c99023a-4c99-4c99-ac99-4c99023a0000
status: stable
description: Detection rule for MITRE ATT&CK technique T1574.001
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/windows/credential_access_imageload_azureadconnectauthsvc.toml
author: elastic (via IncidentBuddy)
date: 2026-07-26
tags:
  - attack.t1574.001
logsource:
  product: azure
  service: entra_id
detection:
  selection:
    # Original elastic detection logic
    # library where host.os.type == "windows" and process.name : "AzureADConnectAuthenticationAgentService.exe" and
    # 
    # not dll.code_signature.trusted == true and
    # not dll.path : (
    #     "?:\\Windows\\assembly\\NativeImages*",
    #     "?:\\Windows\\Microsoft.NET\\*",
    #     "?:\\Windows\\WinSxS\\*",
    #     "?:\\Windows\\System32\\DriverStore\\FileRepository\\*"
    # )
  condition: selection
level: medium
