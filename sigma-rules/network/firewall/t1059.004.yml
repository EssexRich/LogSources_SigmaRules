status: stable
description: Detection rule for MITRE ATT&CK technique T1059.004
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/linux/command_and_control_cupsd_foomatic_rip_netcon.toml
author: elastic (via IncidentBuddy)
date: 2026-05-10
tags:
  - attack.t1059.004
logsource:
  product: network
  service: firewall
detection:
  selection:
    # Original elastic detection logic
    # sequence by host.id with maxspan=10s
    #   [process where host.os.type == "linux" and event.type == "start" and event.action == "exec" and
    #    process.parent.name == "foomatic-rip" and
    #    process.name in ("bash", "dash", "sh", "tcsh", "csh", "zsh", "ksh", "fish")] by process.entity_id
    #   [network where host.os.type == "linux" and event.type == "start" and
    #    event.action == "connection_attempted"] by process.parent.entity_id
  condition: selection
level: medium
