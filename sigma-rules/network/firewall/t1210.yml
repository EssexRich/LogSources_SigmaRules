title: Abnormally Large DNS Response
id: 131efda1-131e-431e-a31e-131efda10000
status: stable
description: Detection rule for MITRE ATT&CK technique T1210
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/network/lateral_movement_dns_server_overflow.toml
author: elastic (via IncidentBuddy)
date: 2026-06-14
tags:
  - attack.t1210
logsource:
  product: network
  service: firewall
detection:
  selection:
    # Original elastic detection logic
    # ((event.category:(network or network_traffic) and destination.port:53) 
    #       or network.protocol:"dns" 
    #       or data_stream.dataset:(network_traffic.dns or zeek.dns))
    #     and destination.bytes >= 65000
    #     and event.type:("allowed" or "end" or "protocol" or "start")
    # and not (
    #   event.action:("flow_terminated" or "network_flow")
    #   and event.duration > 60000000000
    # )
  condition: selection
level: medium
