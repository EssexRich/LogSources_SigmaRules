title: Windows Network Connection From Program In Suspect Location
id: 73db6516-73db-43db-a3db-73db65160000
status: stable
description: Detection rule for MITRE ATT&CK technique T1011
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_network_connection_from_program_in_suspect_location.yml
author: splunk (via IncidentBuddy)
date: 2026-05-24
tags:
  - attack.t1011
logsource:
  product: network
  service: firewall
detection:
  selection:
    # Original splunk detection logic
    # -
    #     | tstats `security_content_summariesonly`
    #       count min(_time) as firstTime
    #             max(_time) as lastTime
    # 
    #     from datamodel=Network_Traffic.All_Traffic where
    # 
    #     All_Traffic.app IN (
    #         "*\\$Recycle.Bin\\*",
    #         "*\\Config\\SystemProfile\\*",
    #         "*\\PerfLogs\\*",
    #         "*\\Users\\All Users\\*",
    #         "*\\Users\\Default\\*",
    #         "*\\Users\\Public\\*",
    #         "*\\Windows\\addins\\*",
    #         "*\\Windows\\Fonts\\*",
    #         "*\\Windows\\IME\\*"
    #     )
    # 
    #     by All_Traffic.dest All_Traffic.dest_ip All_Traffic.dest_port All_Traffic.src
    #        All_Traffic.src_ip All_Traffic.src_port All_Traffic.transport All_Traffic.protocol
    #        All_Traffic.protocol_version All_Traffic.direction All_Traffic.action All_Traffic.app
    #        All_Traffic.dvc All_Traffic.user All_Traffic.vendor_product
    # 
    #     | `drop_dm_object_name(All_Traffic)`
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `windows_network_connection_from_program_in_suspect_location_filter`
  condition: selection
level: medium
