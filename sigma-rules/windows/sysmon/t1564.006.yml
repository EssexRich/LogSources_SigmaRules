title: Windows Suspicious QEMU Execution
id: 3c1da8c1-3c1d-4c1d-ac1d-3c1da8c10000
status: stable
description: Detection rule for MITRE ATT&CK technique T1564.006
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_suspicious_qemu_execution.yml
author: splunk (via IncidentBuddy)
date: 2026-08-16
tags:
  - attack.t1564.006
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    # Original splunk detection logic
    # -
    #     `sysmon`
    #     EventID=1
    #     CommandLine="*-nographic*"
    #     CommandLine="*.img*"
    #     (
    #         Description="*QEMU machine*"
    #         OR
    #         Product="QEMU"
    #         OR
    #         Company="*qemu*"
    #     )
    #     | fillnull
    #     | stats count min(_time) as firstTime
    #                   max(_time) as lastTime
    #       by Computer EventID CommandLine Description Product Company action dest
    #          original_file_name parent_process parent_process_exec parent_process_guid
    #          parent_process_id parent_process_name parent_process_path process_hash
    #          process_integrity_level user user_id vendor_product
    # 
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `windows_suspicious_qemu_execution_filter`
  condition: selection
level: medium
