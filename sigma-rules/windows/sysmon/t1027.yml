title: Suspicious Windows Powershell Arguments
id: 0cfbe674-0cfb-4cfb-acfb-0cfbe6740000
status: stable
description: Detection rule for MITRE ATT&CK technique T1027
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/windows/execution_windows_powershell_susp_args.toml
author: elastic (via IncidentBuddy)
date: 2026-05-31
tags:
  - attack.t1027
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    # Original elastic detection logic
    # process where host.os.type == "windows" and event.type == "start" and
    #  process.name : "powershell.exe" and
    # 
    #   not (
    #     ?user.id == "S-1-5-18" and
    #     /* Don't apply the user.id exclusion to Sysmon for compatibility */
    #     not data_stream.dataset : ("windows.sysmon_operational", "windows.sysmon")
    #   ) and
    # 
    #   not process.parent.executable : (
    #         "?:\\Program Files\\*.exe",
    #         "?:\\Program Files (x86)\\*.exe"
    #   ) and
    # 
    #   (
    #     process.command_line : (
    #           "*^*^*^*^*^*^*^*^*^*",
    #           "*`*`*`*`*",
    #           "*+*+*+*+*+*+*",
    #           "*[char[]](*)*-join*",
    #           "*Base64String*",
    #           "*[*Convert]*",
    #           "*.Compression.*",
    #           "*-join($*",
    #           "*.replace*",
    #           "*MemoryStream*",
    #           "*WriteAllBytes*",
    #           "* -enc *",
    #           "* -ec *",
    #           "* /e *",
    #           "* /enc *",
    #           "* /ec *",
    #           "*WebClient*",
    #           "*DownloadFile*",
    #           "*DownloadString*",
    #           "* iex*",
    #           "* iwr*",
    #           "* aQB3AHIAIABpA*",
    #           "*Reflection.Assembly*",
    #           "*Assembly.GetType*",
    #           "*$env:temp\\*start*",
    #           "*powercat*",
    #           "*nslookup -q=txt*",
    #           "*$host.UI.PromptForCredential*",
    #           "*Net.Sockets.TCPClient*",
    #           "*curl *;Start*",
    #           "powershell.exe \"<#*",
    #           "*ssh -p *",
    #           "*http*|iex*",
    #           "*@SSL\\DavWWWRoot\\*.ps1*",
    #           "*.lnk*.Seek(0x*",
    #           "*[string]::join(*",
    #           "*[Array]::Reverse($*",
    #           "* hidden $(gc *",
    #           "*=wscri& set*",
    #           "*http'+'s://*",
    #           "*.content|i''Ex*",
    #           "*//:sptth*",
    #           "*//:ptth*",
    #           "*h''t''t''p*",
    #           "*'tp'':''/'*",
    #           "*$env:T\"E\"MP*",
    #           "*;cmd /c $?",
    #           "*s''t''a''r*",
    #           "*$*=Get-Content*AppData*.SubString(*$*",
    #           "*=cat *AppData*.substring(*);*$*",
    #           "*-join'';*|powershell*",
    #           "*.Content;sleep *|powershell*",
    #           "*h\''t\''tp:\''*"
    # ... [truncated]
  condition: selection
level: medium
