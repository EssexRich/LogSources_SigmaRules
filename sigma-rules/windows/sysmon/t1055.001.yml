title: Windows Process Injection Of Wermgr to Known Browser
id: 1794d299-1794-4794-a794-1794d2990000
status: stable
description: Detection rule for MITRE ATT&CK technique T1055.001
references:
  - https://github.com/splunk/security_content/blob/develop/detections/deprecated/windows_process_injection_of_wermgr_to_known_browser.yml
author: splunk (via IncidentBuddy)
date: 2026-07-19
tags:
  - attack.t1055.001
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    # Original splunk detection logic
    # -
    #     `sysmon`
    #     EventCode=8
    #     SourceImage="*\\wermgr.exe"
    #     TargetImage IN ("*\\firefox.exe", "*\\chrome.exe", "*\\iexplore.exe","*\\microsoftedgecp.exe")
    #     | stats count min(_time) as firstTime
    #                   max(_time) as lastTime
    #                   values(NewThreadId) as "NewThreadId"
    #                   values(StartAddress) as "StartAddress"
    #       by dest signature_id signature
    #          SourceProcessGuid SourceProcessId SourceImage
    #          TargetProcessGuid TargetProcessId TargetImage
    #          StartModule StartFunction
    #          SourceUser TargetUser vendor_product
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `windows_process_injection_of_wermgr_to_known_browser_filter`
  condition: selection
level: medium
