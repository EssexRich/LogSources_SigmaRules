title: Windows Process Injection into Commonly Abused Processes
id: 3180e2cc-3180-4180-a180-3180e2cc0000
status: stable
description: Detection rule for MITRE ATT&CK technique T1055.002
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_process_injection_into_commonly_abused_processes.yml
author: splunk (via IncidentBuddy)
date: 2026-08-09
tags:
  - attack.t1055.002
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    # Original splunk detection logic
    # -
    #     `sysmon`
    #     EventCode=10
    #     TargetImage IN (
    #         "*\\backgroundtaskhost.exe",
    #         "*\\calc.exe",
    #         "*\\CalculatorApp.exe",
    #         "*\\chrome.exe",
    #         "*\\dllhost.exe",
    #         "*\\edge.exe",
    #         "*\\firefox.exe",
    #         "*\\lsass.exe",
    #         "*\\mspaint.exe",
    #         "*\\notepad.exe",
    #         "*\\regsvr32.exe",
    #         "*\\searchprotocolhost.exe",
    #         "*\\spoolsv.exe",
    #         "*\\svchost.exe",
    #         "*\\werfault.exe",
    #         "*\\win32calc.exe",
    #         "*\\wordpad.exe",
    #         "*\\wuauclt.exe"
    #     )
    # 
    #     NOT SourceImage IN (
    #         "*:\\Windows\\Program Files (x86)\\*",
    #         "*:\\Windows\\Program Files\\*",
    #         "*:\\Windows\\System32\\*",
    #         "*:\\Windows\\SysWOW64\\*"
    #     )
    # 
    #     GrantedAccess IN (
    #         "0x1f3fff",
    #         "0x1fffff",
    #         "0x40"
    #     )
    # 
    #     | stats values(user) as user
    #             min(_time) as firstTime
    #             max(_time) as lastTime count
    #     by dest user_id parent_process_name parent_process_guid
    #        process_name process_guid process_id signature SourceImage
    #        TargetImage GrantedAccess CallTrace
    # 
    #     | eval CallTrace=split(CallTrace, "|")
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | table firstTime lastTime dest user_id parent_process_name parent_process_guid process_name process_guid process_id signature SourceImage TargetImage GrantedAccess CallTrace
    #     | `windows_process_injection_into_commonly_abused_processes_filter`
  condition: selection
level: medium
