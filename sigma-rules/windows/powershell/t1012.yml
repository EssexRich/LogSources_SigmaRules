title: Windows Software Discovery Via PowerShell
id: 575b0d28-575b-475b-a75b-575b0d280000
status: stable
description: Detection rule for MITRE ATT&CK technique T1012
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_software_discovery_via_powershell.yml
author: splunk (via IncidentBuddy)
date: 2026-06-07
tags:
  - attack.t1012
logsource:
  product: windows
  service: powershell
detection:
  selection:
    # Original splunk detection logic
    # -
    #     `powershell`
    #     EventID="4104"
    #     ScriptBlockText="*Get-ItemProperty *"
    #     ScriptBlockText="*Windows\\CurrentVersion\\Uninstall*"
    #     | fillnull
    #     | stats count min(_time) as firstTime
    #                   max(_time) as lastTime
    #       by Computer EventID ScriptBlockText signature signature_id user_id vendor_product Guid
    #          Opcode Name Path ProcessID ScriptBlockId
    # 
    #     | rename Computer as dest
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `windows_software_discovery_via_powershell_filter`
  condition: selection
level: medium
