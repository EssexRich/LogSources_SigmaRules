title: Host File System Changes via Windows Subsystem for Linux
id: 22ef8883-22ef-42ef-a2ef-22ef88830000
status: stable
description: Detection rule for MITRE ATT&CK technique T1059.004
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_wsl_filesystem.toml
author: elastic (via IncidentBuddy)
date: 2026-08-09
tags:
  - attack.t1059.004
logsource:
  product: windows
  service: general
detection:
  selection:
    # Original elastic detection logic
    # sequence by process.entity_id with maxspan=5m
    # [process where host.os.type == "windows" and event.type == "start" and
    #  process.name : "dllhost.exe" and
    #   /* Plan9FileSystem CLSID - WSL Host File System Worker */
    #  process.command_line : "*{DFB65C4C-B34F-435D-AFE9-A86218684AA8}*"]
    # [file where host.os.type == "windows" and process.name : "dllhost.exe" and
    #   not file.path : "?:\\Windows\\Prefetch\\DLLHOST.exe-????????.pf"]
  condition: selection
level: medium
