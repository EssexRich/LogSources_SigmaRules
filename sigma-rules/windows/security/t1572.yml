status: stable
description: Detection rule for MITRE ATT&CK technique T1572
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_potential_cloudflared_tunnel_execution.yml
author: splunk (via IncidentBuddy)
