status: stable
description: Detection rule for MITRE ATT&CK technique T1037.005
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/linux_file_creation_in_system_generator_directory.yml
author: splunk (via IncidentBuddy)
date: 2026-08-16
tags:
  - attack.t1037.005
logsource:
  product: windows
  service: security
detection:
  selection:
    # Original splunk detection logic
    # -
    #     | tstats `security_content_summariesonly`
    #       count min(_time) as firstTime
    #             max(_time) as lastTime
    # 
    #     from datamodel=Endpoint.Filesystem where
    # 
    #     Filesystem.action IN ("created", "modified")
    #     Filesystem.file_path="*/lib/systemd/system-generators/*"
    # 
    #     by Filesystem.file_path Filesystem.file_name Filesystem.user Filesystem.dest
    #        Filesystem.action Filesystem.process_guid Filesystem.process_id
    # 
    #     | `drop_dm_object_name(Filesystem)`
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `linux_file_creation_in_system_generator_directory_filter`
  condition: selection
level: medium
