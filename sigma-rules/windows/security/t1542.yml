title: Linux EFI Bootloader File Deletion
id: 3694bc74-3694-4694-a694-3694bc740000
status: stable
description: Detection rule for MITRE ATT&CK technique T1542
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/linux_efi_bootloader_file_deletion.yml
author: splunk (via IncidentBuddy)
date: 2026-08-30
tags:
  - attack.t1542
logsource:
  product: windows
  service: security
detection:
  selection:
    # Original splunk detection logic
    # -
    #     | tstats `security_content_summariesonly`
    #       count min(_time) as firstTime
    #             max(_time) as lastTime
    # 
    #     from datamodel=Endpoint.Filesystem where
    # 
    #     Filesystem.action="deleted"
    #     Filesystem.file_path="/boot/efi/EFI/BOOT/*"
    #     Filesystem.file_name="*.efi*"
    # 
    #     by Filesystem.file_path Filesystem.file_name Filesystem.user Filesystem.dest
    #        Filesystem.action Filesystem.process_guid Filesystem.process_id
    # 
    #     | `drop_dm_object_name(Filesystem)`
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `linux_efi_bootloader_file_deletion_filter`
  condition: selection
level: medium
