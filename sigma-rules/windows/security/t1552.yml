title: Unusual Web Config File Access
id: 587ce90d-587c-487c-a87c-587ce90d0000
status: stable
description: Detection rule for MITRE ATT&CK technique T1552
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/windows/credential_access_web_config_file_access.toml
author: elastic (via IncidentBuddy)
date: 2026-10-25
tags:
  - attack.t1552
logsource:
  product: windows
  service: security
detection:
  selection:
    # Original elastic detection logic
    # event.category:file and host.os.type:windows and event.action:open and
    #   file.name:"web.config" and file.path : *VirtualDirectories* and
    #   not process.executable: (
    #         "C:\Program Files\Microsoft Security Client\MsMpEng.exe" or
    #         "C:\Program Files\Windows Defender Advanced Threat Protection\MsSense.exe" or
    #         "C:\Windows\System32\MRT.exe" or
    #         "C:\Windows\System32\inetsrv\w3wp.exe"
    #   )
  condition: selection
level: medium
