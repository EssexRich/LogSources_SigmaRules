status: stable
description: Detection rule for MITRE ATT&CK technique T1608.002
references:
  - https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_unusual_file_creation_in_confluence_directory.yml
author: splunk (via IncidentBuddy)
date: 2026-08-02
tags:
  - attack.t1608.002
logsource:
  product: windows
