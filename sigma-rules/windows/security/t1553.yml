title: Potential Masquerading as System32 DLL
id: 2c3d098e-2c3d-4c3d-ac3d-2c3d098e0000
status: stable
description: Detection rule for MITRE ATT&CK technique T1553
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_masquerading_windows_dll.toml
author: elastic (via IncidentBuddy)
date: 2026-06-28
tags:
  - attack.t1553
logsource:
  product: windows
  service: security
detection:
  selection:
    # Original elastic detection logic
    # library where host.os.type == "windows" and event.action == "load" and 
    # (dll.Ext.relative_file_creation_time <= 3600 or dll.Ext.relative_file_name_modify_time <= 3600) and
    #     not (
    #       dll.path : (
    #         "?:\\Windows\\System32\\*",
    #         "?:\\Windows\\SysWOW64\\*",
    #         "?:\\Windows\\SystemTemp\\*",
    #         "?:\\$WINDOWS.~BT\\NewOS\\Windows\\WinSxS\\*",
    #         "?:\\$WINDOWS.~BT\\NewOS\\Windows\\System32\\*",
    #         "?:\\$WINDOWS.~BT\\Sources\\*",
    #         "?:\\$WINDOWS.~BT\\Work\\*",
    #         "?:\\Windows\\WinSxS\\*",
    #         "?:\\Windows\\SoftwareDistribution\\Download\\*",
    #         "?:\\Windows\\assembly\\NativeImages_v*"
    #       )
    #     ) and
    #     not (
    #       dll.code_signature.subject_name in (
    #         "Microsoft Windows",
    #         "Microsoft Corporation",
    #         "Microsoft Windows Hardware Abstraction Layer Publisher",
    #         "Microsoft Windows Publisher",
    #         "Microsoft Windows 3rd party Component",
    #         "Microsoft 3rd Party Application Component"
    #       ) and dll.code_signature.trusted == true
    #     ) and not dll.code_signature.status : ("errorCode_endpoint*", "errorUntrustedRoot", "errorChaining") and
    #     dll.name : (
    #       "aadauthhelper.dll", "aadcloudap.dll", "aadjcsp.dll", "aadtb.dll", "aadwamextension.dll", "aarsvc.dll", "abovelockapphost.dll", "accessibilitycpl.dll", "accountaccessor.dll", "accountsrt.dll", "acgenral.dll", "aclayers.dll", "acledit.dll", "aclui.dll", "acmigration.dll", "acppage.dll", "acproxy.dll", "acspecfc.dll", "actioncenter.dll", "actioncentercpl.dll", "actionqueue.dll", "activationclient.dll", "activeds.dll", "activesynccsp.dll", "actxprxy.dll", "acwinrt.dll", "acxtrnal.dll", "adaptivecards.dll", "addressparser.dll", "adhapi.dll", "adhsvc.dll", "admtmpl.dll", "adprovider.dll", "adrclient.dll", "adsldp.dll", "adsldpc.dll", "adsmsext.dll", "adsnt.dll", "adtschema.dll", "advancedemojids.dll", "advapi32.dll", "advapi32res.dll", "advpack.dll", "aeevts.dll", "aeinv.dll", "aepic.dll", "ajrouter.dll", "altspace.dll", "amsi.dll", "
    # ... [truncated]
  condition: selection
level: medium
