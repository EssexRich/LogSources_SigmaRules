title: AWS Audit or Security Service Tampering via CLI
id: 125e55f1-125e-425e-a25e-125e55f10000
status: stable
description: Detection rule for MITRE ATT&CK technique T1562.001
references:
  - https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/defense_evasion_aws_audit_and_security_service_tampering_via_cli.toml
author: elastic (via IncidentBuddy)
date: 2026-10-04
tags:
  - attack.t1562.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    # Original elastic detection logic
    # event.category : "process" and event.type : "start" and event.action:(start or exec) and 
    # process.name : (aws or aws-cli or aws.exe or aws2) and
    # (
    #   process.command_line : (
    #   *accessanalyzer delete-analyzer* or
    #   *cloudtrail delete-event-data-store* or
    #   *cloudtrail delete-trail* or
    #   *cloudtrail put-event-selectors*IncludeManagementEvents*false* or
    #   *cloudtrail put-event-selectors*ReadWriteType*ReadOnly* or
    #   *cloudtrail stop-logging* or
    #   *cloudtrail update-trail*--no-include-global-service-events* or
    #   *cloudtrail update-trail*--no-is-multi-region-trail* or
    #   *configservice delete-configuration-recorder* or
    #   *configservice delete-delivery-channel* or
    #   *configservice stop-configuration-recorder* or
    #   *detective delete-graph* or
    #   *guardduty create-filter*ARCHIVE* or
    #   *guardduty delete-detector* or
    #   *guardduty delete-publishing-destination* or
    #   *guardduty update-detector*--no-enable* or
    #   *inspector2 disable* or
    #   *logs delete-log-group* or
    #   *logs delete-log-stream* or
    #   *macie2 disable-macie* or
    #   *s3api put-bucket-logging*--bucket-logging-status*\{\}* or
    #   *securityhub batch-disable-standards* or
    #   *securityhub disable-security-hub*
    # ) or
    #   process.args : ("put-retention-policy" and ("--retention-in-days=1" or "1"))
    # ) and
    # not process.args : "help"
  condition: selection
level: medium
