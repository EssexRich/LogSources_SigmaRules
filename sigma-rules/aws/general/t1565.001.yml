author: elastic (via IncidentBuddy)
date: 2026-10-25
tags:
  - attack.t1565.001
logsource:
  product: aws
  service: general
detection:
  selection:
    # Original elastic detection logic
    # data_stream.dataset:"aws.eks_audit" and
    # aws.eks.audit.objectRef.resource:"configmaps" and
    # aws.eks.audit.objectRef.name:"coredns" and
    # aws.eks.audit.objectRef.namespace:"kube-system" and
    # aws.eks.audit.verb:("update" or "patch" or "delete") and
    # aws.eks.audit.annotations.authorization_k8s_io/decision:"allow" and
    # not user.name:(
    #   system\:serviceaccount\:kube-system\:coredns or
    #   system\:node\:* or
    #   eks\:*
    # )
  condition: selection
