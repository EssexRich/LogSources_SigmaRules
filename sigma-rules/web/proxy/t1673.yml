title: ESXi Bulk VM Termination
id: 60c83480-60c8-40c8-a0c8-60c834800000
status: stable
description: Detection rule for MITRE ATT&CK technique T1673
references:
  - https://github.com/splunk/security_content/blob/develop/detections/application/esxi_bulk_vm_termination.yml
author: splunk (via IncidentBuddy)
date: 2026-10-04
tags:
  - attack.t1673
logsource:
  product: web
  service: proxy
detection:
  selection:
    # Original splunk detection logic
    # -
    #     `esxi_syslog`
    #     Message IN (
    #         "*pkill -9 *",
    #         "*process kill*"
    #     )
    #     | rex field=_raw "\s\[(?<user>[^\]]+)\]:\s(?<shell_command>.+)$"
    #     | rex field=_raw "Z (?<dest>[\w\.]+)\s.*:\s(?<esxicli_Command>esxcli\s.+)"
    #     | eval command=mvappend(esxicli_Command, shell_Command)
    #     | where isnotnull(command)
    #     | search (command="pkill -9 vmx-*")
    #              OR
    #              (
    #                 command="*esxcli*"
    #                 command="*--format-param*"
    #                 command="*vm process list*"
    #                 command="*awk*"
    #                 command="*esxcli vm process kill*"
    #             )
    #     | stats min(_time) as firstTime
    #             max(_time) as lastTime
    #             values(_time) as timeStamp
    #             values(command) as commands
    # 
    #       by dest user
    # 
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `esxi_bulk_vm_termination_filter`
  condition: selection
level: medium
