detection:
  selection:
    # Original splunk detection logic
    # -
    #     | tstats `security_content_summariesonly`
    #              count min(_time) as firstTime
    #                    max(_time) as lastTime
    #                    latest(Web.http_method) as http_method
    #                    latest(Web.http_user_agent) as http_user_agent
    #                    latest(Web.url) as url
    #                    latest(Web.user) as user
    #                    latest(Web.dest) as dest
    # 
    #     FROM datamodel=Web WHERE
    # 
    #     Web.url_domain=*
    #     NOT Web.url_domain IN (
    #           "-",
    #           "unknown"
    #     )
    #     [
    #         | inputlookup remote_access_software
    #         | search domain!=""
    #         | rename domain as Web.url_domain
    #         | table Web.url_domain
    #     ]
    # 
    #     BY Web.action Web.src Web.category
    #        Web.url_domain Web.url_length
    # 
    #     | `drop_dm_object_name("Web")`
    # 
    #     | lookup local=t remote_access_software domain AS url_domain OUTPUT app as signature, category, reference, description
    # 
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    # 
    #     | `remote_access_software_usage_exceptions`
    # 
    #     | `detect_remote_access_software_usage_url_filter`
  condition: selection
level: medium
