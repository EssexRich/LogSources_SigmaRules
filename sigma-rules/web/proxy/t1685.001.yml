title: Cisco ASA - Logging Message Suppression
id: 5e08b078-5e08-4e08-ae08-5e08b0780000
status: stable
description: Detection rule for MITRE ATT&CK technique T1685.001
references:
  - https://github.com/splunk/security_content/blob/develop/detections/application/cisco_asa___logging_message_suppression.yml
author: splunk (via IncidentBuddy)
date: 2026-07-19
tags:
  - attack.t1685.001
logsource:
  product: web
  service: proxy
detection:
  selection:
    # Original splunk detection logic
    # `cisco_asa`
    #     message_id IN (111008, 111010)
    #     command = "no logging message *"
    #     | fillnull
    #     | stats count
    #             earliest(_time) as firstTime
    #             latest(_time) as lastTime
    #             values(user) as user
    #             values(action) as action
    #             values(message_id) as message_id
    #             values(command) as command
    #             values(src_ip) as src_ip
    #             values(process_name) as process_name
    #       by host
    #     | `security_content_ctime(firstTime)`
    #     | `security_content_ctime(lastTime)`
    #     | `cisco_asa___logging_message_suppression_filter`
  condition: selection
level: medium
